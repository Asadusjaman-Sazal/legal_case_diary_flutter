<!DOCTYPE html>

          "primary-fixed": "#e6e8ea",
          "primary-fixed-dim": "#c6c6cd",
          "on-primary-fixed": "#131b2e",
          "on-primary-fixed-variant": "#45464d",
          "secondary-fixed": "#e6e8ea",
          "secondary-fixed-dim": "#c6c6cd",
          "on-secondary-fixed": "#131b2e",
          "on-secondary-fixed-variant": "#45464d",

<style>
  body { background-color: #f8fafc; }
</style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center p-edge-margin antialiased">
<!-- The language switch the shipped screen carries above the card, top right
     (user request): English / বাংলা, the active one filled black with a check. -->
<div class="w-full max-w-[400px] flex justify-end gap-sm mb-md">
  <button class="flex items-center gap-xs h-9 px-gutter rounded-lg bg-black text-white font-title-md text-title-md font-semibold" type="button">
    English
    <span class="material-symbols-outlined text-[16px]">check</span>
  </button>
  <button class="flex items-center gap-xs h-9 px-gutter rounded-lg border border-outline bg-surface-container-lowest text-black font-bengali-title-md text-bengali-title-md font-semibold" type="button">
    বাংলা
    <span class="material-symbols-outlined text-[16px] text-transparent">check</span>
  </button>
</div>

<!-- Sign-in card. The shipped screen is a Part B stub; this mockup is the design. -->
<div class="w-full max-w-[400px] bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg">
  <div class="flex flex-col items-center mb-xl">
    <div class="w-12 h-12 flex items-center justify-center overflow-hidden mb-sm">
      <img alt="Legal Case Diary" class="w-full h-full object-contain" src="../../assets/icons/app_logo.png">
    </div>
    <h1 class="font-headline-lg text-headline-lg text-primary text-center">Legal Case Diary</h1>
    <p class="mt-xs font-body-md text-body-md text-on-surface-variant text-center">Log in to the app</p>
  </div>

  <form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
    <div class="flex flex-col">
      <label class="mb-unit font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
      <input class="w-full bg-surface-variant border-0 border-b-2 border-card-border focus:border-primary focus:ring-0 rounded-t px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="example@gmail.com" type="text">
    </div>

    <div class="flex flex-col">
      <div class="flex justify-between items-end mb-unit">
        <label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
        <a class="font-label-md text-label-md text-secondary hover:underline" href="#">Forgot Password?</a>
      </div>
      <div class="relative flex items-center">
        <input class="w-full bg-surface-variant border-0 border-b-2 border-card-border focus:border-primary focus:ring-0 rounded-t pl-md pr-xl py-sm font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password">
        <button class="absolute right-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" onclick="togglePassword()" type="button">
          <span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility_off</span>
        </button>
      </div>
    </div>

    <button class="w-full bg-secondary text-on-secondary font-title-md text-title-md py-gutter rounded-lg hover:opacity-90 transition-opacity mt-sm" type="submit">Login</button>
  </form>

  <div class="flex items-center gap-sm my-lg">
    <div class="flex-1 h-px bg-outline-variant"></div>
    <span class="font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
    <div class="flex-1 h-px bg-outline-variant"></div>
  </div>

  <button class="w-full border border-outline-variant bg-surface-container-lowest text-on-surface font-title-md text-title-md py-gutter rounded-lg hover:bg-secondary-hover transition-colors flex justify-center items-center gap-sm" type="button">
    <svg fill="none" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.72 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
      <path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.72 17.58C14.74 18.24 13.48 18.64 12 18.64C9.14 18.64 6.72 16.71 5.84 14.12H2.16V16.96C3.98 20.58 7.7 23 12 23Z" fill="#34A853"></path>
      <path d="M5.84 14.12C5.61 13.44 5.49 12.73 5.49 12C5.49 11.27 5.61 10.56 5.84 9.88V7.04H2.16C1.41 8.53 1 10.22 1 12C1 13.78 1.41 15.47 2.16 16.96L5.84 14.12Z" fill="#FBBC05"></path>
      <path d="M12 5.36C13.62 5.36 15.07 5.92 16.22 7.02L19.36 3.88C17.46 2.1 14.97 1 12 1C7.7 1 3.98 3.42 2.16 7.04L5.84 9.88C6.72 7.29 9.14 5.36 12 5.36Z" fill="#EA4335"></path>
    </svg>
    Login with Google
  </button>
</div>

<div class="mt-lg text-center">
  <p class="font-body-md text-body-md text-on-surface-variant">
    Don't have an account?
    <a class="ml-unit font-title-md text-title-md text-secondary hover:underline" href="#">Sign Up</a>
  </p>
</div>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const visibilityIcon = document.getElementById('visibility-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      visibilityIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      visibilityIcon.textContent = 'visibility_off';
    }
  }
</script>
</body>
</html>
