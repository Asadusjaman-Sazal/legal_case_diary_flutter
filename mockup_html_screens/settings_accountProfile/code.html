<style>
  body { background-color: #f8fafc; }

<body class="bg-background text-on-surface font-body-md">
<!-- Sub-page app bar: back chevron then the title, left-aligned. -->
<header class="sticky top-0 z-50 bg-surface border-b border-outline-variant">
  <div class="flex items-center h-16 px-edge-margin max-w-lg mx-auto w-full">
    <button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="ml-sm font-headline-md text-headline-md font-bold text-primary">Account &amp; Profile</h1>
  </div>
</header>

<!-- Three labelled sections of SettingsMenuCards, sized by the shared card
     contract. Firm moved to its own Settings entry at 0.0.663 (user request):
     the row and its visibility now live on the Firm page. -->
<main class="max-w-lg mx-auto w-full px-md pt-md pb-xl">
  <!-- PROFILE -->
  <p class="font-label-md text-label-md font-semibold text-tertiary">Profile</p>
  <div class="mt-sm">
    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">person</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Profile</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Your name, bar association, and membership details</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>
  </div>

  <!-- ACCOUNT -->
  <p class="mt-lg font-label-md text-label-md font-semibold text-tertiary">Account</p>
  <div class="mt-sm flex flex-col gap-sm">
    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">manage_accounts</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Manage Account</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Your account details, password, and sign-out</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>

    <!-- App Lock and Devices moved here from Manage Account (0.0.611, user
         request). Devices is drawn only where the plan holds more than one
         device, so this drawing (Pro and above) shows it. -->
    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">key</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">App Lock</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Protect the app with a PIN or fingerprint</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>

    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">devices</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Devices</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">The devices that can use this account at the same time.</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>


    <!-- Security is gone (0.0.411): Change Password came back to Manage
         Account, so a whole row for one action earned nothing. -->
  </div>

  <!-- SUBSCRIPTION (0.0.624): the plan, the store and the ledger, moved out of
       the intermediate Subscription screen. A chamber member sees Manage Plan
       and Subscription History only; the plans are the owner's to buy. -->
  <p class="mt-lg font-label-md text-label-md font-semibold text-tertiary">Subscription</p>
  <div class="mt-sm flex flex-col gap-sm">
    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">star</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Manage Plan</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Your plan, expiry, and cancellation</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>

    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">add_shopping_cart</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Subscription Plans</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Compare plans and buy a new one</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>

    <button class="w-full bg-surface border border-surface-container rounded-xl p-md flex items-center hover:bg-secondary-hover transition-colors text-left">
      <span class="material-symbols-outlined text-primary text-[28px]">history</span>
      <div class="ml-md flex-1">
        <p class="font-body-lg text-body-lg text-on-surface">Subscription History</p>
        <p class="mt-xs font-body-sm text-body-sm text-on-surface">Every purchase, approval, and cancellation</p>
      </div>
      <span class="material-symbols-outlined text-tertiary">chevron_right</span>
    </button>
  </div>
</main>
</body>
</html>
