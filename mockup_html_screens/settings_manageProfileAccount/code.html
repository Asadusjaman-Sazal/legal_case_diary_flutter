<style>
  body { background-color: #f8fafc; }
</style>

<body class="bg-background text-on-surface font-body-md">
<!-- Sub-page app bar: back chevron then the title, left-aligned. -->
<header class="sticky top-0 z-50 bg-surface border-b border-outline-variant">
  <div class="flex items-center h-16 px-edge-margin max-w-lg mx-auto w-full">
    <button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="ml-sm font-headline-md text-headline-md font-bold text-primary">Manage Account</h1>
  </div>
</header>

<main class="max-w-lg mx-auto w-full px-edge-margin pt-md pb-xl">
  <!-- Profile summary card: who this account is, and nothing else. The small
       inline Logout that used to sit under the address is a full-size action
       card below (0.0.411, user request). Values shown are the user's own. -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg flex flex-col items-center">
    <div class="w-24 h-24 rounded-full bg-surface-variant border-2 border-primary flex items-center justify-center overflow-hidden">
      <span class="font-headline-md text-headline-md font-bold text-primary">A</span>
    </div>
    <span class="mt-md font-title-lg text-title-lg text-primary text-center">Asadusjaman</span>
    <span class="mt-xs font-body-md text-body-md text-on-surface-variant text-center">advocate.asad@law.com</span>
  </div>

  <!-- Logout: the SAME action card as Delete Account below it, in the neutral
       tone. Both cards are one widget in the app (SettingsActionCard), so the
       size the user asked to be shared cannot drift: 16 px padding, a 44 px
       minimum content row, a 40 px icon circle. -->
  <div class="mt-lg">
    <button class="w-full flex items-center bg-surface-container-lowest border border-outline-variant rounded-2xl p-md hover:bg-secondary-hover transition-colors text-left">
      <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary mr-md">
        <span class="material-symbols-outlined">logout</span>
      </div>
      <div class="flex-1 min-h-[44px] flex flex-col justify-center">
        <span class="block font-title-md text-title-md text-on-surface">Logout</span>
      </div>
    </button>
  </div>

  <!-- Change Password: back on this screen (0.0.411) from the Account &
       Profile menu's Security sub-page, directly under Logout. Subscription
       Details / Purchase New Subscription stay on the Subscription sub-page. -->
  <div class="mt-sm">
    <button class="w-full flex items-center bg-surface-container-lowest border border-outline-variant rounded-2xl p-md hover:bg-secondary-hover transition-colors text-left">
      <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary mr-md">
        <span class="material-symbols-outlined">lock</span>
      </div>
      <div class="flex-1 min-h-[44px] flex items-center">
        <span class="block font-title-md text-title-md text-on-surface">Change Password</span>
      </div>
      <span class="material-symbols-outlined text-outline-variant">chevron_right</span>
    </button>
  </div>

  <!-- Danger Zone: the red bold section label the user asked for, introducing
       the one irreversible action on this screen. It obeys the same label-md
       style as every other section heading, in the error colour and bold. -->
  <p class="mt-lg font-label-md text-label-md font-bold text-error tracking-wider">Danger Zone</p>

  <!-- Deleting the data without the account (0.0.473, user request): the SAME
       card as Delete Account above the one that removes the account itself, so
       the three read as one column. Which of the two titles is drawn is the
       account's plan — this drawing is the premium one, "Delete Local & Cloud
       Data"; a free account's card is "Delete Local Data" and touches this
       device alone. Both open ONE tick list ("Delete Data?" — Cases, Notes,
       Case References and the Custom Seed Data line below them), whose red
       Delete Selected button stays disabled until something is ticked; the
       profile, the subscription and the settings are never in that list, and
       neither card exists for a firm account, whose diary is shared. -->
  <div class="mt-sm">
    <button class="w-full flex items-center bg-error-container border border-error/20 rounded-2xl p-md hover:opacity-90 transition-opacity text-left">
      <div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center text-error mr-md">
        <span class="material-symbols-outlined">delete_sweep</span>
      </div>
      <div class="flex-1 min-h-[44px] flex flex-col justify-center">
        <span class="block font-title-md text-title-md text-on-error-container">Delete Local &amp; Cloud Data</span>
        <span class="block mt-xs font-body-sm text-body-sm text-error/80">This action cannot be undone</span>
      </div>
    </button>
  </div>

  <!-- The destructive action, warned and wired (0.0.411). Tapping it opens the
       warning: what the deletion takes with it — worded for a free account,
       whose diary only ever lived on this device, or a premium one, whose diary
       is in the cloud too — and that the result is permanent. Confirmed, the
       warning opens the typed confirmation screen (0.0.412,
       `/settings/manage-account/delete`), where `delete my account` must be
       typed before the button will do anything; that screen then asks the
       server, and the device goes back to a fresh install. Offline it refuses:
       the account row is on the server. (The confirmation screen has no mockup
       of its own — per rule 9 it does not need one.) -->
  <div class="mt-sm pb-xl">
    <button class="w-full flex items-center bg-error-container border border-error/20 rounded-2xl p-md hover:opacity-90 transition-opacity text-left">
      <div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center text-error mr-md">
        <span class="material-symbols-outlined">delete</span>
      </div>
      <div class="flex-1 min-h-[44px] flex flex-col justify-center">
        <span class="block font-title-md text-title-md text-on-error-container">Delete Account</span>
        <span class="block mt-xs font-body-sm text-body-sm text-error/80">This action cannot be undone</span>
      </div>
    </button>
  </div>
</main>
</body>
</html>
