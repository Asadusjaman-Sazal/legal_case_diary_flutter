<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Settings - Legal Case Diary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "background": "#f8fafc",
          "on-background": "#191c1e",
          "surface": "#ffffff",
          "on-surface": "#191c1e",
          "on-surface-variant": "#45464d",
          "surface-dim": "#d8dadc",
          "surface-bright": "#f7f9fb",
          "surface-variant": "#f1f5f9",
          "surface-container-lowest": "#ffffff",
          "surface-container-low": "#f2f4f6",
          "surface-container": "#eceef0",
          "surface-container-high": "#e6e8ea",
          "surface-container-highest": "#e0e3e5",
          "inverse-surface": "#2d3133",
          "inverse-on-surface": "#eff1f3",
          "surface-tint": "transparent",
          "outline": "#76777d",
          "outline-variant": "#c6c6cd",
          "card-border": "#e2e8f0",
          "primary": "#0f172a",
          "on-primary": "#ffffff",
          "primary-container": "#131b2e",
          "on-primary-container": "#7c839b",
          "inverse-primary": "#c6c6cd",
          "secondary": "#000000",
          "on-secondary": "#ffffff",
          "secondary-container": "#000000",
          "on-secondary-container": "#fefcff",
          "tertiary": "#64748b",
          "on-tertiary": "#ffffff",
          "tertiary-container": "#0b1c30",
          "on-tertiary-container": "#75859d",
          "error": "#dc2626",
          "on-error": "#ffffff",
          "error-container": "#ffdad6",
          "on-error-container": "#93000a",
          "success": "#059669",
          "court-notice": "#dc2626",
          "status-active": "#059669",
          "ink-dark": "#020617",
          "primary-fixed": "#e6e8ea",
          "primary-fixed-dim": "#c6c6cd",
          "on-primary-fixed": "#131b2e",
          "on-primary-fixed-variant": "#45464d",
          "secondary-fixed": "#e6e8ea",
          "secondary-fixed-dim": "#c6c6cd",
          "on-secondary-fixed": "#131b2e",
          "on-secondary-fixed-variant": "#45464d",
          "tertiary-fixed": "#eceef0",
          "tertiary-fixed-dim": "#c6c6cd",
          "on-tertiary-fixed": "#131b2e",
          "on-tertiary-fixed-variant": "#45464d",
          "overlay-54": "rgba(0, 0, 0, 0.54)",
          "secondary-hover": "rgba(0, 0, 0, 0.05)"
        },
        borderRadius: {
          "sm": "2px",
          "DEFAULT": "4px",
          "md": "6px",
          "lg": "8px",
          "xl": "12px",
          "2xl": "16px",
          "full": "9999px"
        },
        spacing: {
          "unit": "4px",
          "xs": "4px",
          "sm": "8px",
          "md": "16px",
          "lg": "24px",
          "xl": "32px",
          "xxl": "48px",
          "xxxl": "64px",
          "edge-margin": "16px",
          "gutter": "12px",
          "list-item": "12px",
          "card-padding": "16px"
        },
        fontFamily: {
          "headline-lg": ["Manrope"],
          "headline-md": ["Manrope"],
          "title-lg": ["Manrope"],
          "title-md": ["Inter"],
          "body-lg": ["Inter"],
          "body-md": ["Inter"],
          "body-sm": ["Inter"],
          "label-lg": ["IBM Plex Sans"],
          "label-md": ["IBM Plex Sans"],
          "case-number": ["IBM Plex Sans"],
          "bengali-title-md": ["Tiro Bangla"],
          "bengali-body-lg": ["Tiro Bangla"],
          "bengali-body-md": ["Tiro Bangla"],
          "bengali-body-sm": ["Tiro Bangla"]
        },
        fontSize: {
          "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
          "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
          "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
          "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
          "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
          "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
          "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
          "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
          "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
          "case-number": ["14px", { "lineHeight": "20px", "letterSpacing": "0.2px", "fontWeight": "700" }],
          "bengali-title-md": ["16px", { "lineHeight": "1.5", "fontWeight": "600" }],
          "bengali-body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
          "bengali-body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
          "bengali-body-sm": ["12px", { "lineHeight": "1.5", "fontWeight": "400" }]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; }
</style>
</head>
<body class="bg-background text-on-surface font-body-md">
<!-- App bar: menu, title and the search affordance; the back button sits on its
     own row below, exactly as the shipped Settings header does. -->
<header class="sticky top-0 z-50 bg-surface border-b border-outline-variant">
  <div class="flex items-center h-14 px-edge-margin gap-sm max-w-lg mx-auto w-full">
    <button aria-label="Open navigation menu" class="flex items-center justify-center w-10 h-10 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <h1 class="font-headline-md text-headline-md font-bold text-primary">Settings</h1>
    <span class="flex-grow"></span>
    <button aria-label="Search Settings" class="flex items-center justify-center w-10 h-10 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">search</span>
    </button>
  </div>
  <div class="flex items-center px-edge-margin pb-xs max-w-lg mx-auto w-full">
    <button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
  </div>
</header>

<main class="max-w-lg mx-auto w-full pb-24">
  <!-- GENERAL -->
  <section class="pb-lg">
    <h2 class="px-edge-margin pt-md pb-xs font-label-md text-label-md font-semibold text-tertiary">General</h2>
    <div class="bg-surface border-y border-outline-variant">
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">person</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Accounts &amp; Profile</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <!-- Firm moved here from Account & Profile (0.0.663, user request), so
           the entry a firm owner looks for is named on the Settings list. It is
           offered to every account; the page behind it shows only the rows that
           account may use. -->
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">apartment</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Firm</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <!-- Subscription follows Firm (0.0.701, user request): the plan, the
           plans and the ledger, moved out of Account & Profile's section into
           their own Settings entry. Offered to every account; the page behind
           it hides the rows a chamber member may not use. -->
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">workspace_premium</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Subscription</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">sync</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Online Sync</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">cloud_upload</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Backup &amp; Restore</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- PREFERENCES -->
  <section class="pb-lg">
    <h2 class="px-edge-margin pt-md pb-xs font-label-md text-label-md font-semibold text-tertiary">Preferences</h2>
    <div class="bg-surface border-y border-outline-variant">
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">gavel</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Edit Court/Steps</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">notifications</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Notifications</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">language</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Language</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">visibility</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">View Settings</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- APP INFO -->
  <section class="pb-lg">
    <h2 class="px-edge-margin pt-md pb-xs font-label-md text-label-md font-semibold text-tertiary">App Info</h2>
    <div class="bg-surface border-y border-outline-variant">
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">info</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Guidelines</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <!-- About carries the updater's dot (user request) when a check has found
           a newer release. The updater only ever notifies: nothing installs
           behind the user's back. -->
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">info</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">About</span>
        <span class="w-2.5 h-2.5 rounded-full" style="background-color:#059669"></span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
      <div class="mx-edge-margin h-px bg-outline-variant"></div>
      <!-- Support moved here from About (user request): it is the entry a
           blocked user reaches for, and two taps deep inside About cost them
           the most. -->
      <button class="w-full flex items-center gap-md px-edge-margin py-md hover:bg-secondary-hover transition-colors">
        <span class="material-symbols-outlined text-primary">help</span>
        <span class="flex-grow text-left font-body-lg text-body-lg text-on-surface">Support</span>
        <span class="material-symbols-outlined text-tertiary">chevron_right</span>
      </button>
    </div>
  </section>
</main>
</body>
</html>
