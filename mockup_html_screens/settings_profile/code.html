<style>
  body { background-color: #f8fafc; }
</style>

<body class="bg-background text-on-surface font-body-md pb-xl">
<!-- Sub-page app bar: back chevron then the title, left-aligned. -->
<header class="sticky top-0 z-50 bg-surface border-b border-outline-variant">
  <div class="flex items-center h-16 px-edge-margin max-w-lg mx-auto w-full">
    <button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-primary hover:bg-surface-container transition-colors active:opacity-80">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="ml-sm font-headline-md text-headline-md font-bold text-primary">Profile</h1>
  </div>
</header>

<main class="max-w-lg mx-auto w-full px-edge-margin pt-sm pb-xl">
  <!-- Avatar header: the picture itself is the control (user request, 0.0.658).
       Tapping it opens the full-screen Profile Picture viewer, whose sub-page
       header carries the back arrow, Delete (only when a picture exists) and
       the larger Edit action. No overlay badge sits on the picture. -->
  <div class="flex flex-col items-center mb-lg">
    <div class="w-32 h-32 rounded-full border-4 border-white shadow-md overflow-hidden bg-surface-container-highest flex items-center justify-center">
      <span class="font-headline-md text-headline-md font-bold text-on-surface-variant">AS</span>
    </div>
    <span class="mt-md font-title-lg text-title-lg text-on-background">Asadusjaman</span>
  </div>

  <!-- Read-only data card: each field falls back to an em dash when blank. -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg flex flex-col">
    <div class="py-md flex items-start gap-sm">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">person</span>
      <div class="flex-1">
        <p class="font-label-md text-label-md text-on-surface-variant">Full Name</p>
        <p class="mt-xs font-body-lg text-body-lg text-on-surface">Asadusjaman</p>
      </div>
    </div>
    <div class="py-md flex items-start gap-sm">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">account_balance</span>
      <div class="flex-1">
        <p class="font-label-md text-label-md text-on-surface-variant">Bar Association</p>
        <p class="mt-xs font-body-lg text-body-lg text-on-surface">Dhaka Bar Association</p>
      </div>
    </div>
    <div class="py-md flex items-start gap-sm">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">badge</span>
      <div class="flex-1">
        <p class="font-label-md text-label-md text-on-surface-variant">Membership No.</p>
        <p class="mt-xs font-body-lg text-body-lg text-on-surface">1557</p>
      </div>
    </div>
    <div class="py-md flex items-start gap-sm">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">location_on</span>
      <div class="flex-1">
        <p class="font-label-md text-label-md text-on-surface-variant">Office Address</p>
        <p class="mt-xs font-body-lg text-body-lg text-on-surface">Chamber 402, High Court Annex, Dhaka-1000</p>
      </div>
    </div>
    <div class="py-md flex items-start gap-sm">
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">call</span>
      <div class="flex-1">
        <p class="font-label-md text-label-md text-on-surface-variant">Mobile No.</p>
        <p class="mt-xs font-body-lg text-body-lg text-on-surface">+88 01812332721</p>
      </div>
    </div>
  </div>
</main>

<!-- Edit FAB, bottom-right, as the shipped screen's only edit affordance. -->
<button aria-label="Edit Profile" class="fixed bottom-lg right-lg w-14 h-14 rounded-2xl bg-primary text-on-primary flex items-center justify-center shadow-lg">
  <span class="material-symbols-outlined">edit</span>
</button>
</body>
</html>
