<body class="bg-background text-on-surface font-body-md">
<!-- Task 23's Admin Panel. This is the reference for
     lib/features/admin/presentation/admin_panel_screen.dart.

     The panel is a **menu**: two shared Settings sub-menu rows, each opening a
     page of its own. It used to render the payment queue itself; that queue now
     lives on the *Payment Requests* page
     (admin_payment_requests_screen.dart), and *Non-verified Accounts*
     (admin_unconfirmed_accounts_screen.dart) is the second page.

     The frame is the signed-in admin's own: the case screens' header with the
     side menu, the title and the shared sync button, but no back arrow (the
     drawer and the system back gesture are the two ways out), no search and no
     view toggle (both act on a case list and this screen has none). This is a
     **top-level destination** — the side menu and a bottom-navigation tab — so
     it keeps the hamburger rather than the back arrow its two sub-pages wear.
     The Sync Status badge is not drawn because it appears only while blocked or
     conflicted work is held, and the ordinary state is nothing held.

     The sync button is drawn in its ordinary enabled state — primary ink and
     the "Sync" tooltip — because the panel is reached only by a signed-in
     admin with sync available, not the grey free-plan variant the case screens
     show. Each row is the shared Settings sub-menu card: a leading icon, a
     Title Case title, a sentence-case subtitle, and — in place of the shared
     chevron — the count of what is waiting behind it, so the admin can see at a
     glance whether the trip is worth making. The count is always drawn, `0`
     included, because a row that hid its number would leave the admin unable to
     tell "nothing waiting" from "not loaded yet".

     The body is pull-to-sync: a downward drag runs the same forced drain the
     header's sync button does and then re-reads both lists. -->
<main class="max-w-lg mx-auto min-h-screen flex flex-col bg-background">

  <!-- App header: the case screens' own, minus what has nothing to act on. -->
  <header class="h-14 bg-surface flex items-center">
    <button aria-label="Open Navigation Menu" class="w-12 h-12 flex items-center justify-center text-primary active:opacity-70">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <h1 class="flex-1 truncate font-title-lg text-title-lg text-primary">Admin Panel</h1>
    <button aria-label="Sync" class="w-12 h-12 flex items-center justify-center text-primary active:opacity-70">
      <span class="material-symbols-outlined">cloud_done</span>
    </button>
    <span class="w-1"></span>
  </header>

  <!-- Body: the two pages the panel holds. -->
  <div class="flex-1 px-edge-margin pt-md pb-xl flex flex-col gap-gutter">

    <!-- Payment Requests: the queue, with its Pending and Resolved sections. -->
    <button class="bg-surface border border-surface-container rounded-xl p-md flex items-center text-left active:opacity-80">
      <span class="material-symbols-outlined text-primary text-[28px]">receipt_long</span>
      <span class="ml-md flex-1 flex flex-col">
        <span class="font-body-lg text-body-lg text-on-surface">Payment Requests</span>
        <span class="mt-xs font-body-sm text-body-sm text-on-surface-variant">Approve Or Reject Submitted Payments</span>
      </span>
      <span class="font-title-md text-title-md text-on-surface-variant">2</span>
    </button>

    <!-- Non-verified Accounts: the sign-ups that never confirmed their address
         and have sat that way for over 72 hours, listed so abandoned ones can
         be cleaned up. A fresh sign-up is not shown: it may still be confirming. -->
    <button class="bg-surface border border-surface-container rounded-xl p-md flex items-center text-left active:opacity-80">
      <span class="material-symbols-outlined text-primary text-[28px]">person_off</span>
      <span class="ml-md flex-1 flex flex-col">
        <span class="font-body-lg text-body-lg text-on-surface">Non-verified Accounts</span>
        <span class="mt-xs font-body-sm text-body-sm text-on-surface-variant">Sign-Ups Unconfirmed For Over 72 Hours</span>
      </span>
      <span class="font-title-md text-title-md text-on-surface-variant">3</span>
    </button>

  </div>
</main>
</body>
