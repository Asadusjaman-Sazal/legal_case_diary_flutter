<main class="pb-24 pt-4">

</div>
<div class="bg-surface-container-lowest border-y border-outline-variant">
<!-- Profile -->
<button class="w-full flex items-center px-edge-margin py-md touch-ripple gap-md group">
<span class="material-symbols-outlined text-outline group-hover:text-secondary" data-icon="person">person</span>
<span class="flex-grow text-left font-body-lg text-body-lg">Accounts &amp; Profile</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<div class="ml-[56px] h-px bg-outline-variant"></div>
<!-- Online Sync -->
<button class="w-full flex items-center px-edge-margin py-md touch-ripple gap-md group">
<span class="material-symbols-outlined text-outline group-hover:text-secondary" data-icon="sync">sync</span>
<div class="flex-grow text-left flex items-center gap-sm">
<span class="font-body-lg text-body-lg">Online Sync</span>

</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<div class="ml-[56px] h-px bg-outline-variant"></div>

<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>

<div class="px-edge-margin py-sm">
<h2 class="font-label-lg text-label-lg text-on-primary-container uppercase tracking-wider">Preferences</h2>
</div>
<div class="bg-surface-container-lowest border-y border-outline-variant">
<!-- Edit Court/Steps -->
<button class="w-full flex items-center px-edge-margin py-md touch-ripple gap-md group">

<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<div class="ml-[56px] h-px bg-outline-variant"></div>
<!-- Notifications -->

<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>

<div class="ml-[56px] h-px bg-outline-variant"></div>

</div>
</section>
