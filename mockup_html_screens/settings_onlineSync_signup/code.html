<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<main class="flex-grow flex items-center justify-center p-edge-margin w-full">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden relative">
<!-- Header Section -->
<div class="px-lg pt-xl pb-md">
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-primary text-[28px]">gavel</span>
<span class="font-headline-md text-headline-md font-bold text-ink-dark tracking-tight">Legal Case Diary</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the secure ledger for legal professionals.</p>
</div>
<!-- Form Section -->
<div class="px-lg pb-xl">
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-variant border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t py-sm px-md transition-colors placeholder:text-on-surface-variant/50" id="fullName" name="fullName" placeholder="Adv. John Doe" required="" type="text">
</div>
</div>
<!-- Bar Association/Membership No -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="barNo">Bar Association</label>
<div class="relative">
<input class="w-full bg-surface-variant border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t py-sm px-md transition-colors placeholder:text-on-surface-variant/50" id="barNo" name="barNo" placeholder="Dhaka Bar" required="" type="text">
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-variant border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t py-sm px-md transition-colors placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="john.doe@chambers.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="password">Password</label>
<div class="relative group">
<input class="w-full bg-surface-variant border-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 font-body-md text-body-md text-on-surface rounded-t py-sm pl-md pr-10 transition-colors placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
<p class="mt-xs font-body-sm text-body-sm text-on-surface-variant">Must be at least 8 characters long.</p>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm pt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary focus:ring-offset-surface-container-lowest bg-surface-variant" id="terms" name="terms" required="" type="checkbox">
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-secondary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-secondary hover:underline font-medium" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full flex justify-center items-center py-md px-lg bg-ink-dark text-on-primary rounded font-label-lg text-label-lg hover:bg-on-primary-fixed transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ink-dark focus:ring-offset-surface-container-lowest active:scale-[0.98]" type="submit">
                            Sign Up
                        </button>
<div class="relative flex items-center py-xs">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-md font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<button class="w-full flex justify-center items-center gap-sm py-sm px-lg bg-surface-container-lowest border border-outline-variant text-on-surface rounded font-label-lg text-label-lg hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-outline-variant focus:ring-offset-surface-container-lowest active:scale-[0.98]" type="button">
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.57C14.73 18.23 13.48 18.63 12 18.63C9.14 18.63 6.71 16.7 5.84 14.1H2.15V16.96C3.96 20.55 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.1C5.62 13.43 5.49 12.73 5.49 12C5.49 11.27 5.62 10.57 5.84 9.9V7.04H2.15C1.41 8.52 1 10.2 1 12C1 13.8 1.41 15.48 2.15 16.96L5.84 14.1Z" fill="#FBBC05"></path>
<path d="M12 5.38C13.62 5.38 15.07 5.94 16.22 7.03L19.36 3.89C17.46 2.12 14.97 1 12 1C7.69 1 3.96 3.45 2.15 7.04L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38Z" fill="#EA4335"></path>
</svg>
                            Sign up with Google
                        </button>
</div>

<p class="font-body-md text-body-md text-on-surface">
                    Already have an account? <a class="text-ink-dark font-semibold hover:text-secondary transition-colors" href="#">Login</a>
</p>

<script>
        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
