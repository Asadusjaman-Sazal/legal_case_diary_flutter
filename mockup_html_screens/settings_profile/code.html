<!-- Micro-interaction Scripts -->
<script>
        document.querySelectorAll('input, select, textarea').forEach(element => {
            element.addEventListener('focus', () => {
                element.parentElement.querySelector('.material-symbols-outlined').style.opacity = '1';
                element.parentElement.querySelector('.material-symbols-outlined').style.color = '#2563EB';
            });
            element.addEventListener('blur', () => {
                element.parentElement.querySelector('.material-symbols-outlined').style.opacity = '0.5';
                element.parentElement.querySelector('.material-symbols-outlined').style.color = '#45464d';
            });
        });

        const saveBtn = document.querySelector('button[type="submit"]');
        saveBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
            setTimeout(() => {
                saveBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Saved Successfully';
                saveBtn.classList.replace('bg-primary', 'bg-status-active');
                setTimeout(() => {
                    saveBtn.innerHTML = '<span class="material-symbols-outlined">save</span> Save Profile';
                    saveBtn.classList.replace('bg-status-active', 'bg-primary');
                }, 2000);
            }, 1000);
        });
    </script>
