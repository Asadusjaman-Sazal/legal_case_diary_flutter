name: legal_case_diary
description: "Offline-first case diary for lawyers with local encryption and future sync support."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Initial build version; user-facing versioning is tracked in docs/version_history.md.
version: 0.0.270

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

# Dependencies will be expanded in Phase 2 of Task 01.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # iOS-style icons.
  cupertino_icons: ^1.0.8

  # State management provider used by the Phase 1 app root (expanded in Phase 2).
  flutter_riverpod: ^3.3.2

  # Declarative routing (real GoRouter configuration comes in Task 06).
  go_router: ^17.3.0

  # Date formatting and localization utilities.
  intl: ^0.20.2

  # Local DB. Drift core with SQLite3MultipleCiphers-backed encryption
  # (Task 03). Native libraries are bundled via the sqlite3 build hook.
  drift: ^2.19.0

  # Local preferences and secure key storage.
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # Identification helpers and built-in collection utilities.
  uuid: ^4.6.0
  collection: ^1.19.1

  # Notifications, exact-alarm scheduling, and device information (Task 13).
  flutter_local_notifications: ^22.1.0
  android_alarm_manager_plus: ^5.1.0
  android_intent_plus: ^6.0.0
  device_info_plus: ^13.2.0

  # Launcher (Task 14 tasks such as phone/SMS/email).
  url_launcher: ^6.3.2

  # Profile picture selection (Task 12 Phase 2 Profile screen).
  image_picker: ^1.1.2

  # Encryption support for the sqlite3/Drift native database (Task 03).
  # SQLite3MultipleCiphers is selected via the hooks section below.
  sqlite3: ^3.5.0

  path: ^1.9.1
  path_provider: ^2.1.6

  # PDF export, the standard OS print dialog, and sharing the app (Task 14).
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^13.1.0

  # Excel (.xlsx) backup read/write (Task 15). Both were already resolved
  # transitively through `pdf`, and the app now builds and parses the OOXML/ZIP
  # container itself: the `excel` package pins `xml <7`, which `pdf` cannot use,
  # so the two can never coexist in this project.
  archive: ^4.0.9
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates launcher icons from the canonical app logo PNG.
  flutter_launcher_icons: ^0.14.4

  # Recommended lint set for Flutter apps.
  flutter_lints: ^6.0.0

  # Code generation for Drift tables (Task 03); downgraded from latest to be
  # compatible with the current Flutter SDK's pinned `meta` version.
  drift_dev: ^2.19.0

  # Dart build runner (Task 03); downgraded to align with drift_dev/analyzer.
  build_runner: ^2.4.14

# Build hooks for the sqlite3 package. This selects SQLite3MultipleCiphers as
# the bundled SQLite implementation, enabling transparent full-database
# encryption via PRAGMA key. See: https://drift.simonbinder.eu/platforms/encryption/
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# Launcher icons generated from assets/icons/app_logo.png.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/app_logo.png
  # Adaptive icon (Android 8+), which is what stops the launcher drawing the
  # logo as a small legacy icon on a plate. The background MUST be opaque: an
  # adaptive icon's background layer may not contain transparency (Android
  # Developers, "Implementing Adaptive Icons": "background drawables must be
  # opaque whilst foregrounds can contain transparency"), and a transparent value
  # is filled in by the launcher — it renders as a black plate. So the background
  # is a plain white plate, which the navy book sits on.
  #
  # 22% is the size the user settled on. The canvas is 108 dp and may be masked to
  # 72 dp (36 dp radius), so the largest size at which EVERY logo pixel stays
  # inside is 24% (farthest pixel 34.89 dp from the centre). At 23% it is
  # 36.23 dp — sub-pixel past the rim — and at 22% it is 37.52 dp, about 1.5 dp
  # (~6 px at xxxhdpi), so the outermost corner of the cover's page edge is
  # trimmed slightly. See docs/currentlyWorking.md for the full sweep.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_logo.png
  adaptive_icon_foreground_inset: 22
  web:
    generate: true
    image_path: assets/icons/app_logo.png

flutter:
  # Material Icons support.
  uses-material-design: true

  # Required for flutter_localizations code generation.
  generate: true

  # Bundled images (the About screen's app logo and developer profile photo).
  assets:
    - assets/images/
    - assets/icons/
    # The legal documents shown by Settings > About. They are bundled from
    # `docs/legal/` on purpose: it is the single copy, so the text the app shows
    # can never drift from the text in the repository.
    - docs/legal/

  # Custom fonts for the Justice Ledger design system (Task 02).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: "assets/fonts/Inter-VariableFont_slnt,wght.ttf"
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
    - family: TiroBangla
      fonts:
        - asset: assets/fonts/TiroBangla-Regular.ttf
